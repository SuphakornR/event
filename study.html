<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https:; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' https: data:;" />
  <title>Study &amp; Life Planner — HelpDaiCha</title>
  <meta name="description" content="ตัวช่วยจัดตารางเรียน งานค้าง โฟกัสจับเวลา Pomodoro และแฟลชการ์ดทบทวนบทเรียนสำหรับนักเรียนนักศึกษา" />
  <meta name="theme-color" content="#F4D03F" />
  <link rel="icon" type="image/svg+xml" href="assets/img/logo.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Prompt:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/vox.css?v=20261123d" />
  <style>
    .flashcard-face {
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.2s ease;
    }
    .task-item-enter {
      animation: voxFadeSlide 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-yellow-300 selection:text-black">
  <script src="assets/js/loader.js?v=20261123c"></script>

  <main class="w-full max-w-6xl mx-auto px-3.5 sm:px-6 py-4 flex-1 flex flex-col gap-4">

    <!-- Editorial Header -->
    <header class="border-b-[3px] border-[#111111] pb-3 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-2.5 min-w-0">
        <a href="index.html" title="กลับหน้าหลัก" aria-label="กลับหน้าหลัก" class="btn-vox bg-white hover:bg-[#F4D03F] text-[#111111] w-9 h-9 rounded-lg font-display font-black text-sm flex items-center justify-center shrink-0">←</a>
        <img src="assets/img/logo.svg" alt="HelpDaiCha" class="w-8 h-8 shrink-0 hidden sm:block" />
        <div class="min-w-0">
          <div class="flex items-center gap-2">
            <span class="bg-[#111111] text-[#F4D03F] px-2 py-0.5 rounded font-display font-black text-[10px] tracking-wider">STUDY &amp; LIFE</span>
            <span id="study-date-label" class="text-[11px] font-bold text-[#111111]/60"></span>
          </div>
          <h1 class="thai-safe-tight font-display font-black text-xl sm:text-2xl text-[#111111] truncate">Study &amp; Life Planner</h1>
        </div>
      </div>

      <!-- Daily Stats Summary + Backup -->
      <div class="flex flex-wrap items-center gap-2 shrink-0">
        <div class="bg-white border-2 border-[#111111] rounded-xl px-3 py-1.5 shadow-[2px_2px_0px_#111111] flex items-center gap-3 text-xs">
          <div class="flex items-center gap-1 font-display font-bold">
            <span class="text-[#111111]/60">โฟกัสวันนี้:</span>
            <span id="stat-focus-mins" class="font-black text-[#111111] tabular-nums">0 นาที</span>
          </div>
          <span class="w-px h-4 bg-[#111111]/20"></span>
          <div class="flex items-center gap-1 font-display font-bold">
            <span class="text-[#111111]/60">งานค้าง:</span>
            <span id="stat-pending-tasks" class="font-black text-[#E74C3C] tabular-nums">0</span>
          </div>
        </div>
        <button type="button" id="study-export-btn" class="btn-vox bg-white hover:bg-[#F4D03F] text-[#111111] font-display font-bold text-xs px-3 py-1.5 rounded-xl cursor-pointer">สำรองข้อมูล</button>
        <label class="btn-vox bg-white hover:bg-[#F4D03F] text-[#111111] font-display font-bold text-xs px-3 py-1.5 rounded-xl cursor-pointer">
          <span>กู้คืน</span>
          <input type="file" id="study-import-input" accept=".json,application/json" class="hidden" />
        </label>
      </div>
    </header>

    <!-- Main 2-Column Practical Grid -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 flex-1 items-start">

      <!-- LEFT COLUMN (5 cols): Focus Timer + Active Recall Flashcards -->
      <div class="lg:col-span-5 flex flex-col gap-4">

        <!-- 1. Pomodoro Focus Timer Card -->
        <section class="vox-card bg-white p-4 sm:p-5 flex flex-col gap-3.5" aria-label="ตัวจับเวลาอ่านหนังสือ">
          <div class="flex items-center justify-between gap-2 border-b-2 border-[#111111]/10 pb-2.5">
            <div class="flex items-center gap-2">
              <span id="pomo-mode-badge" class="px-2.5 py-0.5 rounded-md border-2 border-[#111111] bg-[#F4D03F] font-display font-black text-[11px]">FOCUS MODE</span>
              <span id="pomo-sessions-count" class="text-xs font-bold text-[#111111]/60">0 รอบ</span>
            </div>
            <div class="inline-flex items-center gap-1 bg-[#F8F6F0] border-2 border-[#111111] rounded-lg p-0.5">
              <button type="button" data-pomo-preset="25,5" class="pomo-preset-btn px-2 py-0.5 rounded font-display font-bold text-[11px] bg-[#111111] text-[#F4D03F] cursor-pointer">25/5</button>
              <button type="button" data-pomo-preset="50,10" class="pomo-preset-btn px-2 py-0.5 rounded font-display font-bold text-[11px] text-[#111111] hover:bg-white cursor-pointer">50/10</button>
              <button type="button" data-pomo-preset="15,3" class="pomo-preset-btn px-2 py-0.5 rounded font-display font-bold text-[11px] text-[#111111] hover:bg-white cursor-pointer">15/3</button>
            </div>
          </div>

          <!-- Big Editorial Countdown -->
          <div class="bg-[#F8F6F0] border-2 border-[#111111] rounded-2xl p-4 flex flex-col items-center gap-2">
            <div id="pomo-time-display" class="font-display font-black text-5xl sm:text-6xl text-[#111111] tabular-nums tracking-tight leading-none">25:00</div>
            <div class="w-full h-2.5 bg-white border-2 border-[#111111] rounded-full overflow-hidden mt-1">
              <div id="pomo-progress-bar" class="h-full bg-[#F4D03F] transition-all duration-300" style="width: 100%;"></div>
            </div>
            <select id="pomo-task-select" aria-label="เลือกงานที่กำลังโฟกัส" class="mt-1 w-full bg-white border border-[#111111]/40 rounded-lg px-2.5 py-1.5 text-xs font-semibold text-[#111111] focus:outline-none">
              <option value="">🎯 โฟกัสอิสระ (ไม่ได้ผูกกับงาน)</option>
            </select>
          </div>

          <div class="grid grid-cols-3 gap-2">
            <button type="button" id="pomo-toggle-btn" class="col-span-2 btn-vox bg-[#F4D03F] hover:bg-[#f2c61d] text-[#111111] font-display font-black text-sm py-2.5 rounded-xl cursor-pointer">เริ่มโฟกัส</button>
            <button type="button" id="pomo-reset-btn" class="btn-vox bg-white hover:bg-[#F8F6F0] text-[#111111] font-display font-bold text-xs py-2.5 rounded-xl cursor-pointer">รีเซ็ต</button>
          </div>
        </section>

        <!-- 2. Quick Active Recall Flashcards -->
        <section class="vox-card bg-white p-4 sm:p-5 flex flex-col gap-3" aria-label="แฟลชการ์ดทบทวน">
          <div class="flex items-center justify-between gap-2 border-b-2 border-[#111111]/10 pb-2">
            <h2 class="font-display font-extrabold text-sm text-[#111111]">แฟลชการ์ดทบทวน (Active Recall)</h2>
            <span id="fc-counter" class="text-[11px] font-display font-bold text-[#111111]/60">0 / 0</span>
          </div>

          <div id="fc-stage" class="bg-[#F8F6F0] border-2 border-[#111111] rounded-2xl p-4 min-h-[130px] flex flex-col items-center justify-center text-center gap-2 cursor-pointer select-none hover:bg-[#FFFDF5] transition-colors" title="คลิกเพื่อพลิกดูคำตอบ">
            <span id="fc-side-badge" class="px-2 py-0.5 rounded bg-[#111111] text-[#F4D03F] font-display font-bold text-[10px] uppercase">คำถาม / หัวข้อ</span>
            <p id="fc-text" class="thai-safe font-display font-bold text-base text-[#111111] whitespace-pre-line">ยังไม่มีแฟลชการ์ด กด + เพิ่มการ์ดด้านล่างได้เลย</p>
            <span class="text-[10px] font-semibold text-[#111111]/45">คลิกที่การ์ดเพื่อพลิก</span>
          </div>

          <div class="flex items-center justify-between gap-2">
            <div class="flex items-center gap-1.5">
              <button type="button" id="fc-prev-btn" class="btn-vox bg-white hover:bg-[#F4D03F] px-3 py-1.5 rounded-lg font-display font-black text-xs cursor-pointer">←</button>
              <button type="button" id="fc-next-btn" class="btn-vox bg-white hover:bg-[#F4D03F] px-3 py-1.5 rounded-lg font-display font-black text-xs cursor-pointer">→</button>
              <button type="button" id="fc-del-btn" class="btn-vox bg-white hover:bg-red-50 text-[#E74C3C] px-2.5 py-1.5 rounded-lg font-display font-bold text-xs cursor-pointer" title="ลบการ์ดใบนี้">ลบ</button>
            </div>
            <button type="button" id="fc-toggle-add-btn" class="btn-vox bg-[#111111] text-[#F4D03F] font-display font-bold text-xs px-3 py-1.5 rounded-lg cursor-pointer">+ เพิ่มการ์ด</button>
          </div>

          <form id="fc-add-form" class="hidden flex-col gap-2 pt-2 border-t-2 border-dashed border-[#111111]/15">
            <input id="fc-in-front" type="text" required maxlength="160" placeholder="ด้านหน้า: คำถาม / ศัพท์ / สูตร..." class="thai-safe bg-[#F8F6F0] border-2 border-[#111111] rounded-xl px-3 py-1.5 text-xs font-bold focus:outline-none focus:bg-white" />
            <textarea id="fc-in-back" rows="2" required maxlength="400" placeholder="ด้านหลัง: คำตอบ / คำอธิบาย..." class="thai-safe bg-[#F8F6F0] border-2 border-[#111111] rounded-xl px-3 py-1.5 text-xs font-medium resize-none focus:outline-none focus:bg-white"></textarea>
            <button type="submit" class="btn-vox bg-[#F4D03F] hover:bg-[#f2c61d] text-[#111111] font-display font-black text-xs py-1.5 rounded-xl cursor-pointer">บันทึกแฟลชการ์ด</button>
          </form>
        </section>
      </div>

      <!-- RIGHT COLUMN (7 cols): Tasks & Weekly Schedule Tabs -->
      <div class="lg:col-span-7 flex flex-col gap-4">
        <section class="vox-card bg-white p-4 sm:p-5 flex flex-col gap-3.5 min-h-[520px]">
          <!-- Main Mode Tabs -->
          <div class="flex flex-wrap items-center justify-between gap-2 border-b-[2.5px] border-[#111111] pb-3">
            <div class="inline-flex items-center gap-1.5 bg-[#F8F6F0] border-2 border-[#111111] rounded-xl p-1">
              <button type="button" data-main-tab="tasks" class="main-tab-btn px-3.5 py-1.5 rounded-lg font-display font-extrabold text-xs bg-[#111111] text-[#F4D03F] cursor-pointer transition-colors">รายการงานและการบ้าน</button>
              <button type="button" data-main-tab="schedule" class="main-tab-btn px-3.5 py-1.5 rounded-lg font-display font-extrabold text-xs text-[#111111] hover:bg-white cursor-pointer transition-colors">ตารางเรียน / ตารางอ่าน</button>
            </div>
            <button type="button" id="tasks-clear-done-btn" class="text-xs font-display font-bold text-[#111111]/60 hover:text-[#E74C3C] cursor-pointer">ล้างงานที่เสร็จแล้ว</button>
          </div>

          <!-- TAB 1: TASKS & ASSIGNMENTS -->
          <div id="panel-tasks" class="flex-1 flex flex-col gap-3">
            <form id="task-add-form" class="bg-[#F8F6F0] border-2 border-[#111111] rounded-2xl p-3 flex flex-col gap-2">
              <div class="flex flex-col sm:flex-row gap-2">
                <input id="task-title-in" type="text" required maxlength="140" placeholder="เพิ่มการบ้าน งานที่ต้องส่ง หรือสิ่งที่ต้องทำ..." class="thai-safe flex-1 bg-white border-2 border-[#111111] rounded-xl px-3 py-2 text-sm font-semibold focus:outline-none" />
                <button type="submit" class="btn-vox bg-[#F4D03F] hover:bg-[#f2c61d] text-[#111111] font-display font-black text-xs sm:text-sm px-4 py-2 rounded-xl shrink-0 cursor-pointer">+ เพิ่มงาน</button>
              </div>
              <div class="flex flex-wrap items-center gap-2 text-xs">
                <input id="task-subject-in" type="text" maxlength="24" placeholder="วิชา/หมวด (เช่น คณิต, ชีวิต)" class="thai-safe bg-white border border-[#111111]/50 rounded-lg px-2.5 py-1 text-xs font-semibold w-40 focus:outline-none" />
                <input id="task-due-in" type="date" aria-label="กำหนดส่ง" class="bg-white border border-[#111111]/50 rounded-lg px-2 py-1 text-xs font-semibold focus:outline-none" />
                <select id="task-prio-in" aria-label="ความสำคัญ" class="bg-white border border-[#111111]/50 rounded-lg px-2 py-1 text-xs font-bold cursor-pointer">
                  <option value="normal">ปกติ</option>
                  <option value="high">สำคัญมาก 🔥</option>
                  <option value="low">ไม่เร่งด่วน</option>
                </select>
              </div>
            </form>

            <!-- Filter Pills -->
            <div class="flex flex-wrap items-center gap-1.5">
              <button type="button" data-task-filter="all" class="task-filter-btn px-2.5 py-1 rounded-lg border-2 border-[#111111] bg-[#111111] text-[#F4D03F] font-display font-bold text-xs cursor-pointer">ทั้งหมด</button>
              <button type="button" data-task-filter="today" class="task-filter-btn px-2.5 py-1 rounded-lg border-2 border-[#111111] bg-white text-[#111111] hover:bg-[#F4D03F]/40 font-display font-bold text-xs cursor-pointer">ส่งวันนี้</button>
              <button type="button" data-task-filter="high" class="task-filter-btn px-2.5 py-1 rounded-lg border-2 border-[#111111] bg-white text-[#111111] hover:bg-[#F4D03F]/40 font-display font-bold text-xs cursor-pointer">สำคัญมาก</button>
              <button type="button" data-task-filter="done" class="task-filter-btn px-2.5 py-1 rounded-lg border-2 border-[#111111] bg-white text-[#111111] hover:bg-[#F4D03F]/40 font-display font-bold text-xs cursor-pointer">เสร็จแล้ว</button>
            </div>

            <div id="tasks-list" class="flex-1 flex flex-col gap-2 overflow-y-auto max-h-[420px] pr-0.5 vox-scroll-area"></div>
          </div>

          <!-- TAB 2: WEEKLY SCHEDULE -->
          <div id="panel-schedule" class="hidden flex-1 flex-col gap-3">
            <!-- Day Selector -->
            <div id="sched-day-tabs" class="grid grid-cols-7 gap-1"></div>

            <form id="sched-add-form" class="bg-[#F8F6F0] border-2 border-[#111111] rounded-2xl p-3 grid grid-cols-1 sm:grid-cols-12 gap-2 items-center">
              <input id="sched-time-in" type="text" required maxlength="20" placeholder="09:00 - 10:30" class="sm:col-span-3 bg-white border-2 border-[#111111] rounded-xl px-2.5 py-1.5 text-xs font-mono font-bold focus:outline-none" />
              <input id="sched-title-in" type="text" required maxlength="80" placeholder="ชื่อวิชา / ช่วงอ่านหนังสือ..." class="thai-safe sm:col-span-4 bg-white border-2 border-[#111111] rounded-xl px-2.5 py-1.5 text-xs font-bold focus:outline-none" />
              <input id="sched-note-in" type="text" maxlength="60" placeholder="ห้อง / หมายเหตุ" class="thai-safe sm:col-span-3 bg-white border border-[#111111]/50 rounded-xl px-2.5 py-1.5 text-xs font-semibold focus:outline-none" />
              <button type="submit" class="sm:col-span-2 btn-vox bg-[#F4D03F] hover:bg-[#f2c61d] text-[#111111] font-display font-black text-xs py-1.5 rounded-xl cursor-pointer">+ เพิ่ม</button>
            </form>

            <div id="sched-list" class="flex-1 flex flex-col gap-2 overflow-y-auto max-h-[380px] pr-0.5 vox-scroll-area"></div>
          </div>
        </section>
      </div>
    </div>
  </main>

  <script src="assets/js/security.js"></script>
  <script src="assets/js/study.js"></script>
</body>
</html>
