  <script>
    (() => {
      const ac = new AbortController();
      const { signal } = ac;

      let savedEventSummary = null;
      try {
        const rawSb = localStorage.getItem('vox_scoreboard_clean_v3');
        if (rawSb) {
          const parsedSb = JSON.parse(rawSb);
          if (parsedSb?.eventTitle && Array.isArray(parsedSb?.teams)) {
            savedEventSummary = `${parsedSb.eventTitle} • ${parsedSb.teams.length} ทีม`;
          }
        }
      } catch (_) {}

      const TOOLS = [
        {
          id: 'scoreboard',
          shape: 0,
          href: 'scoreboard.html',
          title: 'Stage Scoreboard',
          note: savedEventSummary || 'กระดานคะแนนสดบนเวที'
        }
      ];

      const esc = (v) => String(v || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

      function toolCard(t) {
        const mascot = VoxMascots.svg(t.shape, undefined, 'js-mascot-svg pointer-events-none w-28 h-28 sm:w-32 sm:h-32 will-change-transform');
        return `
          <a href="${esc(t.href)}" aria-label="${esc(t.title)}" class="js-mascot-card vox-panel-enter group relative flex flex-col items-center justify-center gap-3.5 p-5 no-underline select-none">
            ${mascot}
            <div class="flex flex-col items-center gap-1">
              <span class="thai-safe-tight font-display font-extrabold text-sm sm:text-base text-[#111111]/75 group-hover:text-[#111111] transition-colors duration-200">${esc(t.title)}</span>
              <span class="thai-safe-tight text-[11px] font-semibold text-[#111111]/55 opacity-0 translate-y-1 group-hover:opacity-100 group-hover:translate-y-0 transition-all duration-200 pointer-events-none">${esc(t.note)}</span>
            </div>
          </a>`;
      }

      let rafId = 0;
      const gridEl = document.getElementById('tool-grid');
      if (gridEl) {
        gridEl.innerHTML = TOOLS.map(toolCard).join('');

        // Damped harmonic spring proximity + magnetic hover on unscaled card center
        const items = Array.from(gridEl.querySelectorAll('.js-mascot-card')).map((card) => ({
          card,
          svg: card.querySelector('.js-mascot-svg'),
          scale: 1,
          vScale: 0,
          targetScale: 1,
          tx: 0,
          ty: 0,
          targetTx: 0,
          targetTy: 0,
          rot: 0,
          targetRot: 0
        })).filter((it) => it.svg);

        const PROXIMITY_PX = 250;

        const tick = () => {
          let active = false;
          for (const it of items) {
            it.vScale = (it.vScale + (it.targetScale - it.scale) * 0.18) * 0.72;
            it.scale += it.vScale;
            it.tx += (it.targetTx - it.tx) * 0.22;
            it.ty += (it.targetTy - it.ty) * 0.22;
            it.rot += (it.targetRot - it.rot) * 0.22;

            const stillMoving =
              Math.abs(it.targetScale - it.scale) > 0.0015 ||
              Math.abs(it.vScale) > 0.0015 ||
              Math.abs(it.targetTx - it.tx) > 0.08 ||
              Math.abs(it.targetTy - it.ty) > 0.08 ||
              Math.abs(it.targetRot - it.rot) > 0.04;

            if (stillMoving) {
              active = true;
              it.svg.style.transform = `translate3d(${it.tx.toFixed(2)}px, ${it.ty.toFixed(2)}px, 0) scale(${it.scale.toFixed(3)}) rotate(${it.rot.toFixed(2)}deg)`;
            } else {
              it.scale = it.targetScale;
              it.tx = it.targetTx;
              it.ty = it.targetTy;
              it.rot = it.targetRot;
              it.svg.style.transform = (it.scale === 1 && it.tx === 0 && it.ty === 0 && it.rot === 0)
                ? ''
                : `translate3d(${it.tx.toFixed(2)}px, ${it.ty.toFixed(2)}px, 0) scale(${it.scale.toFixed(3)}) rotate(${it.rot.toFixed(2)}deg)`;
            }
          }
          rafId = active ? requestAnimationFrame(tick) : 0;
        };

        const scheduleTick = () => {
          if (!rafId) rafId = requestAnimationFrame(tick);
        };

        const resetScales = () => {
          items.forEach((it) => {
            it.targetScale = 1;
            it.targetTx = 0;
            it.targetTy = 0;
            it.targetRot = 0;
          });
          scheduleTick();
        };

        document.addEventListener('pointermove', (e) => {
          if (e.pointerType && e.pointerType !== 'mouse') return;
          items.forEach((it) => {
            const rect = it.card.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            const dx = e.clientX - cx;
            const dy = e.clientY - cy;
            const dist = Math.hypot(dx, dy);

            if (it.card.matches(':hover')) {
              it.targetScale = 1.48;
              it.targetTx = Math.max(-8, Math.min(8, dx * 0.08));
              it.targetTy = Math.max(-8, Math.min(8, dy * 0.08)) - 4;
              it.targetRot = Math.max(-5, Math.min(5, dx * 0.04));
            } else if (dist < PROXIMITY_PX) {
              const t = 1 - dist / PROXIMITY_PX;
              it.targetScale = 1 + t * t * 0.36;
              it.targetTx = dx * 0.03 * t;
              it.targetTy = dy * 0.03 * t;
              it.targetRot = dx * 0.015 * t;
            } else {
              it.targetScale = 1;
              it.targetTx = 0;
              it.targetTy = 0;
              it.targetRot = 0;
            }
          });
          scheduleTick();
        }, { passive: true, signal });

        items.forEach((it) => {
          it.card.addEventListener('pointerdown', () => {
            it.targetScale = 0.94;
            scheduleTick();
          }, { signal });
          it.card.addEventListener('pointerup', () => {
            it.targetScale = it.card.matches(':hover') ? 1.48 : 1;
            scheduleTick();
          }, { signal });
        });
        document.addEventListener('pointerleave', resetScales, { signal });
        window.addEventListener('blur', resetScales, { signal });
      }

      // Suggestion Box with smooth modal open/close
      (() => {
        const SUGG_KEY = 'vox_suggestions_v1';
        let activeCat = 'ฟีเจอร์ใหม่';
        let items = [];
        try {
          const parsed = JSON.parse(localStorage.getItem(SUGG_KEY) || '[]');
          if (Array.isArray(parsed)) items = parsed;
        } catch (_) {}

        const modalEl = document.getElementById('sugg-modal');
        const listEl = document.getElementById('sugg-list');
        const statusEl = document.getElementById('sugg-status');
        const textEl = document.getElementById('sugg-text');

        const openModal = () => window.VoxUI ? window.VoxUI.openModal(modalEl, textEl) : modalEl?.classList.replace('hidden', 'flex');
        const closeModal = () => window.VoxUI ? window.VoxUI.closeModal(modalEl) : modalEl?.classList.replace('flex', 'hidden');

        document.getElementById('open-sugg-btn')?.addEventListener('click', openModal, { signal });
        document.getElementById('close-sugg-btn')?.addEventListener('click', closeModal, { signal });
        modalEl?.addEventListener('click', (e) => { if (e.target === modalEl) closeModal(); }, { signal });
        window.addEventListener('keydown', (e) => {
          if (e.key === 'Escape' && modalEl && !modalEl.classList.contains('hidden')) closeModal();
        }, { signal });

        const renderSuggestions = () => {
          if (!listEl) return;
          if (!items.length) {
            listEl.classList.add('hidden');
            listEl.classList.remove('flex');
            listEl.innerHTML = '';
            return;
          }
          listEl.classList.remove('hidden');
          listEl.classList.add('flex');
          listEl.innerHTML = items.slice(0, 4).map((it, idx) => `
            <div class="flex items-center justify-between gap-2 bg-[#F8F6F0] border border-[#111111]/25 rounded-lg px-2.5 py-1.5 text-xs">
              <div class="flex items-center gap-2 min-w-0">
                <span class="shrink-0 bg-[#111111] text-[#F4D03F] px-1.5 py-0.5 rounded font-display font-bold text-[10px]">${esc(it.cat)}</span>
                <span class="truncate text-[#111111]/85 font-medium">${esc(it.text)}</span>
              </div>
              <button type="button" data-sugg-del="${idx}" aria-label="ลบข้อเสนอแนะ" class="shrink-0 text-[11px] font-bold text-[#111111]/45 hover:text-[#E74C3C] cursor-pointer">✕</button>
            </div>
          `).join('');
          listEl.querySelectorAll('[data-sugg-del]').forEach(btn => {
            btn.addEventListener('click', () => {
              items.splice(Number(btn.dataset.suggDel), 1);
              try { localStorage.setItem(SUGG_KEY, JSON.stringify(items)); } catch (_) {}
              renderSuggestions();
            });
          });
        };

        document.querySelectorAll('.sugg-cat-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            activeCat = btn.dataset.suggCat;
            document.querySelectorAll('.sugg-cat-btn').forEach(b => {
              const on = b.dataset.suggCat === activeCat;
              b.classList.toggle('bg-[#111111]', on);
              b.classList.toggle('text-[#F4D03F]', on);
              b.classList.toggle('bg-white', !on);
              b.classList.toggle('text-[#111111]', !on);
            });
          }, { signal });
        });

        document.getElementById('sugg-form')?.addEventListener('submit', async (e) => {
          e.preventDefault();
          const val = (textEl?.value || '').trim();
          if (!val) return;
          items.unshift({ cat: activeCat, text: val, at: Date.now() });
          items = items.slice(0, 12);
          try { localStorage.setItem(SUGG_KEY, JSON.stringify(items)); } catch (_) {}
          const cfg = window.HELPDAI_CONFIG || {};
          const defaultApiBase = (!location.hostname.endsWith('github.io') && location.protocol.startsWith('http')) ? location.origin : '';
          const apiBase = (cfg.apiBase || defaultApiBase).replace(/\/$/, '');
          const ep = cfg.suggestionEndpoint || (apiBase ? `${apiBase}/api/suggestions` : '');
          if (ep) {
            try {
              await fetch(ep, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
                body: JSON.stringify({ category: activeCat, message: val })
              });
            } catch (_) {}
          }
          if (textEl) textEl.value = '';
          if (statusEl) {
            statusEl.textContent = '✓ บันทึกข้อเสนอแนะเรียบร้อยแล้ว ขอบคุณครับ!';
            statusEl.classList.remove('hidden');
            setTimeout(() => statusEl.classList.add('hidden'), 3200);
          }
          renderSuggestions();
        }, { signal });

        renderSuggestions();
      })();

      window.__voxRegisterCleanup?.(() => {
        ac.abort();
        if (rafId) cancelAnimationFrame(rafId);
      });
    })();
  </script>
