  <script src="assets/js/config.js?v=20261122f" defer></script>
  <script src="assets/js/bgm-dock.js?v=20261123b" defer></script>
  <script src="assets/js/auth.js?v=20261122e" defer></script>
  <script src="assets/js/tos.js?v=20261122b" defer></script>
  <script src="assets/js/mascots.js?v=20261122b"></script>
  <script src="assets/js/tutorial.js?v=20261122b" defer></script>
  <script>
    (() => {
      // Single source of truth for the menu. status: 'live' | 'soon'
      let savedEventSummary = null;
      try {
        const rawSb = localStorage.getItem('vox_scoreboard_clean_v3');
        if (rawSb) {
          const parsedSb = JSON.parse(rawSb);
          if (parsedSb?.eventTitle && Array.isArray(parsedSb?.teams)) {
            savedEventSummary = { title: parsedSb.eventTitle, teams: parsedSb.teams.length };
          }
        }
      } catch (_) {}

      const TOOLS = [
        {
          id: 'scoreboard',
          status: 'live',
          shape: 0,
          title: 'Stage Scoreboard',
          desc: 'กระดานคะแนนสดบนเวที ปรับเพิ่ม-ลดทีมและกิจกรรมได้อิสระ พร้อมตัวจับเวลา โหวตสด QR Poll เพลง YouTube แชร์จอห้องใหญ่ และฉลองผู้ชนะในหน้าเดียว',
          savedNote: savedEventSummary ? `งานล่าสุด: ${savedEventSummary.title} (${savedEventSummary.teams} ทีม)` : '',
          actions: [
            { label: savedEventSummary ? 'เปิดใช้งานต่อ' : 'เปิดใช้งาน', href: 'scoreboard.html', primary: true }
          ]
        },
        {
          id: 'study',
          status: 'live',
          shape: 1,
          title: 'Study & Life Planner',
          desc: 'ตัวช่วยจัดตารางเรียน งานค้าง โฟกัสจับเวลา Pomodoro แฟลชการ์ดทบทวน Active Recall และสรุปเวลาอ่านหนังสือรายวันในหน้าเดียว',
          actions: [
            { label: 'เปิดใช้งาน', href: 'study.html', primary: true }
          ]
        },
        {
          id: 'coming-soon',
          status: 'soon',
          shape: 2,
          title: 'Live Quiz & Buzzer',
          desc: 'เกมตอบคำถามชิงไหวพริบ กดปุ่ม Buzzer แย่งตอบสดจากมือถือ พร้อมระบบคำนวณคะแนนอัตโนมัติบนเวที',
          actions: []
        }
      ];

      const esc = (v) => String(v).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

      function toolCard(t) {
        const live = t.status === 'live';
        const mascot = VoxMascots.svg(t.shape, live ? undefined : '#E5E1D4', 'w-16 h-16');
        const badge = live
          ? '<span class="text-[11px] font-display font-black px-2.5 py-0.5 rounded-md border-2 border-[#111111] bg-[#F4D03F] shadow-[2px_2px_0px_#111111]">พร้อมใช้งาน</span>'
          : '<span class="text-[11px] font-display font-bold px-2 py-0.5 rounded-md border border-[#111111]/35 bg-white text-[#111111]/60">กำลังพัฒนา</span>';
        const actions = live
          ? `<div class="flex flex-wrap items-center justify-between gap-2.5 mt-auto pt-3 border-t-2 border-dashed border-[#111111]/10">${t.actions.map(a => `
              <a href="${esc(a.href)}" class="btn-vox ${a.primary ? 'bg-[#F4D03F] hover:bg-[#f2c61d]' : 'bg-white hover:bg-yellow-50'} text-[#111111] font-display font-black text-sm px-5 py-2.5 rounded-xl inline-flex items-center gap-1.5">${esc(a.label)} <span aria-hidden="true">→</span></a>`).join('')}${t.id === 'scoreboard' ? '<div id="hub-bgm-slot" aria-label="เครื่องเล่นเพลงพื้นหลัง" class="hidden shrink-0"></div>' : ''}</div>`
          : '<div class="mt-auto pt-3 border-t-2 border-dashed border-[#111111]/10 text-xs font-semibold text-[#111111]/55">จะเปิดให้ใช้งานเร็วๆ นี้</div>';
        return `
          <article class="vox-card p-5 sm:p-6 flex flex-col gap-3 ${live ? 'vox-card-hover bg-white' : 'opacity-65 border-dashed bg-[#F8F6F0] !shadow-none'}">
            <div class="flex items-start justify-between gap-3">
              ${mascot}
              ${badge}
            </div>
            <h2 class="thai-safe-tight font-display font-extrabold text-xl sm:text-2xl text-[#111111]">${esc(t.title)}</h2>
            <p class="text-sm text-[#111111]/75 leading-relaxed">${esc(t.desc)}</p>
            ${t.savedNote ? `<div class="inline-flex items-center gap-1.5 self-start bg-[#F8F6F0] border border-[#111111]/35 rounded-lg px-2.5 py-1 text-xs font-semibold text-[#111111]/85"><span class="w-2 h-2 rounded-full bg-[#2ECC71] shrink-0"></span><span class="truncate max-w-[240px]">${esc(t.savedNote)}</span></div>` : ''}
            ${actions}
          </article>`;
      }

      document.getElementById('tool-grid').innerHTML = TOOLS.map(toolCard).join('');
      document.getElementById('hub-mascots').innerHTML = [0, 1, 2].map(i => VoxMascots.svg(i, undefined, 'w-8 h-8')).join('');

      // Suggestion Box
      (() => {
        const SUGG_KEY = 'vox_suggestions_v1';
        let activeCat = 'ฟีเจอร์ใหม่';
        let items = [];
        try {
          const parsed = JSON.parse(localStorage.getItem(SUGG_KEY) || '[]');
          if (Array.isArray(parsed)) items = parsed;
        } catch (_) {}

        const modalEl = document.getElementById('sugg-modal');
        const listEl = document.getElementById('sugg-list');
        const statusEl = document.getElementById('sugg-status');
        const textEl = document.getElementById('sugg-text');

        const openModal = () => {
          if (!modalEl) return;
          modalEl.classList.remove('hidden');
          modalEl.classList.add('flex');
          modalEl.setAttribute('aria-hidden', 'false');
          textEl?.focus();
        };
        const closeModal = () => {
          if (!modalEl) return;
          modalEl.classList.add('hidden');
          modalEl.classList.remove('flex');
          modalEl.setAttribute('aria-hidden', 'true');
        };
        document.getElementById('open-sugg-btn')?.addEventListener('click', openModal);
        document.getElementById('close-sugg-btn')?.addEventListener('click', closeModal);
        modalEl?.addEventListener('click', (e) => {
          if (e.target === modalEl) closeModal();
        });
        window.addEventListener('keydown', (e) => {
          if (e.key === 'Escape' && modalEl && !modalEl.classList.contains('hidden')) closeModal();
        });

        const renderSuggestions = () => {
          if (!listEl) return;
          if (!items.length) {
            listEl.classList.add('hidden');
            listEl.classList.remove('flex');
            listEl.innerHTML = '';
            return;
          }
          listEl.classList.remove('hidden');
          listEl.classList.add('flex');
          listEl.innerHTML = items.slice(0, 4).map((it, idx) => `
            <div class="flex items-center justify-between gap-2 bg-[#F8F6F0] border border-[#111111]/25 rounded-lg px-2.5 py-1.5 text-xs">
              <div class="flex items-center gap-2 min-w-0">
                <span class="shrink-0 bg-[#111111] text-[#F4D03F] px-1.5 py-0.5 rounded font-display font-bold text-[10px]">${esc(it.cat)}</span>
                <span class="truncate text-[#111111]/85 font-medium">${esc(it.text)}</span>
              </div>
              <button type="button" data-sugg-del="${idx}" aria-label="ลบข้อเสนอแนะ" class="shrink-0 text-[11px] font-bold text-[#111111]/45 hover:text-[#E74C3C] cursor-pointer">✕</button>
            </div>
          `).join('');
          listEl.querySelectorAll('[data-sugg-del]').forEach(btn => {
            btn.addEventListener('click', () => {
              items.splice(Number(btn.dataset.suggDel), 1);
              try { localStorage.setItem(SUGG_KEY, JSON.stringify(items)); } catch (_) {}
              renderSuggestions();
            });
          });
        };

        document.querySelectorAll('.sugg-cat-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            activeCat = btn.dataset.suggCat;
            document.querySelectorAll('.sugg-cat-btn').forEach(b => {
              const on = b.dataset.suggCat === activeCat;
              b.classList.toggle('bg-[#111111]', on);
              b.classList.toggle('text-[#F4D03F]', on);
              b.classList.toggle('bg-white', !on);
              b.classList.toggle('text-[#111111]', !on);
            });
          });
        });

        document.getElementById('sugg-form')?.addEventListener('submit', async (e) => {
          e.preventDefault();
          const val = (textEl?.value || '').trim();
          if (!val) return;
          items.unshift({ cat: activeCat, text: val, at: Date.now() });
          items = items.slice(0, 12);
          try { localStorage.setItem(SUGG_KEY, JSON.stringify(items)); } catch (_) {}
          const cfg = window.HELPDAI_CONFIG || {};
          const defaultApiBase = (!location.hostname.endsWith('github.io') && location.protocol.startsWith('http')) ? location.origin : '';
          const apiBase = (cfg.apiBase || defaultApiBase).replace(/\/$/, '');
          const ep = cfg.suggestionEndpoint || (apiBase ? `${apiBase}/api/suggestions` : '');
          if (ep) {
            try {
              await fetch(ep, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
                body: JSON.stringify({ category: activeCat, message: val })
              });
            } catch (_) {}
          }
          if (textEl) textEl.value = '';
          if (statusEl) {
            statusEl.textContent = '✓ บันทึกข้อเสนอแนะเรียบร้อยแล้ว ขอบคุณครับ!';
            statusEl.classList.remove('hidden');
            setTimeout(() => statusEl.classList.add('hidden'), 3200);
          }
          renderSuggestions();
        });

        renderSuggestions();
      })();

      // Pure Visual Auto-Sliding Banner (Default Arts + Multiple Custom Images)
      const DEFAULT_ARTS = [
        `<svg class="w-full h-full object-cover" viewBox="0 0 420 140" xmlns="http://www.w3.org/2000/svg">
          <rect width="420" height="140" fill="#181818"/>
          <g opacity="0.14" stroke="#FFFFFF" stroke-width="1"><path d="M0 35h420M0 70h420M0 105h420M70 0v140M140 0v140M210 0v140M280 0v140M350 0v140"/></g>
          <rect x="20" y="18" width="120" height="104" rx="12" fill="#F8F6F0" stroke="#111111" stroke-width="4"/>
          <rect x="32" y="30" width="96" height="20" rx="6" fill="#F4D03F" stroke="#111111" stroke-width="2.5"/>
          <rect x="32" y="58" width="96" height="20" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="2.5"/>
          <rect x="32" y="86" width="96" height="20" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="2.5"/>
          <rect x="156" y="18" width="244" height="104" rx="12" fill="#FFFFFF" stroke="#111111" stroke-width="4"/>
          <rect x="172" y="32" width="176" height="20" rx="6" fill="#F4D03F" stroke="#111111" stroke-width="2.5"/>
          <rect x="172" y="60" width="136" height="20" rx="6" fill="#2980B9" stroke="#111111" stroke-width="2.5"/>
          <rect x="172" y="88" width="156" height="20" rx="6" fill="#E74C3C" stroke="#111111" stroke-width="2.5"/>
          <circle cx="372" cy="42" r="14" fill="#F4D03F" stroke="#111111" stroke-width="3"/>
          <path d="M365 45l3-8 4 4 4-4 3 8z" fill="#111111"/>
        </svg>`,
        `<svg class="w-full h-full object-cover" viewBox="0 0 420 140" xmlns="http://www.w3.org/2000/svg">
          <rect width="420" height="140" fill="#122334"/>
          <g opacity="0.14" stroke="#FFFFFF" stroke-width="1"><path d="M0 35h420M0 70h420M0 105h420M70 0v140M140 0v140M210 0v140M280 0v140M350 0v140"/></g>
          <circle cx="92" cy="70" r="46" fill="#F8F6F0" stroke="#111111" stroke-width="4"/>
          <path d="M50 72 Q 71 58 92 72 T 134 72 L 134 114 L 50 114 Z" fill="#2980B9"/>
          <rect x="64" y="56" width="56" height="26" rx="7" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>
          <text x="92" y="74" text-anchor="middle" font-family="Prompt, sans-serif" font-weight="900" font-size="13" fill="#111111">03:00</text>
          <rect x="164" y="20" width="236" height="100" rx="12" fill="#FFFFFF" stroke="#111111" stroke-width="4"/>
          <rect x="180" y="34" width="52" height="52" rx="8" fill="#F8F6F0" stroke="#111111" stroke-width="2.5"/>
          <rect x="188" y="42" width="14" height="14" fill="#111111"/><rect x="210" y="42" width="14" height="14" fill="#111111"/><rect x="188" y="64" width="14" height="14" fill="#111111"/><rect x="210" y="64" width="14" height="14" fill="#F4D03F"/>
          <rect x="244" y="36" width="136" height="14" rx="5" fill="#F4D03F" stroke="#111111" stroke-width="2"/>
          <rect x="244" y="58" width="106" height="14" rx="5" fill="#10B981" stroke="#111111" stroke-width="2"/>
          <rect x="244" y="80" width="120" height="14" rx="5" fill="#E74C3C" stroke="#111111" stroke-width="2"/>
        </svg>`,
        `<svg class="w-full h-full object-cover" viewBox="0 0 420 140" xmlns="http://www.w3.org/2000/svg">
          <rect width="420" height="140" fill="#231720"/>
          <g opacity="0.14" stroke="#FFFFFF" stroke-width="1"><path d="M0 35h420M0 70h420M0 105h420M70 0v140M140 0v140M210 0v140M280 0v140M350 0v140"/></g>
          <rect x="28" y="22" width="364" height="96" rx="16" fill="#FFFFFF" stroke="#111111" stroke-width="4"/>
          <rect x="46" y="38" width="84" height="64" rx="10" fill="#E74C3C" stroke="#111111" stroke-width="3"/>
          <polygon points="80,56 80,84 104,70" fill="#FFFFFF"/>
          <rect x="148" y="42" width="154" height="16" rx="6" fill="#111111"/>
          <rect x="148" y="66" width="114" height="12" rx="5" fill="#F4D03F" stroke="#111111" stroke-width="2"/>
          <g fill="#10B981" stroke="#111111" stroke-width="2">
            <rect x="322" y="64" width="10" height="28" rx="3"/>
            <rect x="338" y="44" width="10" height="48" rx="3" fill="#F4D03F"/>
            <rect x="354" y="54" width="10" height="38" rx="3" fill="#2980B9"/>
          </g>
        </svg>`
      ];

      const HUB_BANNERS_KEY = 'helpdai_hub_custom_banners_v1';
      const HUB_BANNER_OLD_KEY = 'helpdai_hub_custom_banner_v1';
      const trackEl = document.getElementById('promo-track');
      const dotsEl = document.getElementById('promo-dots');
      const viewportEl = document.getElementById('promo-viewport');
      const hubBannerFile = document.getElementById('hub-banner-file');
      const hubSizeBadge = document.getElementById('hub-banner-size-badge');
      let promoIdx = 0;
      let autoTimer = null;

      const getHubCustomImages = () => {
        try {
          const arr = JSON.parse(localStorage.getItem(HUB_BANNERS_KEY) || 'null');
          if (Array.isArray(arr) && arr.length) return arr.filter(Boolean);
          const legacy = localStorage.getItem(HUB_BANNER_OLD_KEY);
          if (legacy) {
            localStorage.setItem(HUB_BANNERS_KEY, JSON.stringify([legacy]));
            localStorage.removeItem(HUB_BANNER_OLD_KEY);
            return [legacy];
          }
        } catch (_) {}
        return [];
      };
      const saveHubCustomImages = (arr) => {
        try {
          if (arr.length) localStorage.setItem(HUB_BANNERS_KEY, JSON.stringify(arr));
          else localStorage.removeItem(HUB_BANNERS_KEY);
        } catch (_) {}
      };

      const syncHubBannerSize = () => {
        if (!viewportEl || !hubSizeBadge) return;
        const r = viewportEl.getBoundingClientRect();
        if (r.width > 0 && r.height > 0) {
          hubSizeBadge.textContent = `${Math.round(r.width)} × ${Math.round(r.height)} px`;
        }
      };
      viewportEl?.addEventListener('pointerenter', syncHubBannerSize);
      window.addEventListener('resize', syncHubBannerSize);

      const getSlideCount = () => {
        const custom = getHubCustomImages();
        return custom.length ? custom.length : DEFAULT_ARTS.length;
      };

      const renderPromoDots = () => {
        if (!dotsEl) return;
        const total = getSlideCount();
        dotsEl.classList.toggle('hidden', total <= 1);
        dotsEl.innerHTML = Array.from({ length: total }, (_, i) => `
          <button type="button" data-promo-dot="${i}" aria-label="สไลด์ ${i + 1}" class="h-1.5 rounded-full transition-all cursor-pointer ${i === promoIdx ? 'w-4 bg-[#F4D03F]' : 'w-1.5 bg-white/60'}"></button>
        `).join('');
        dotsEl.querySelectorAll('[data-promo-dot]').forEach(btn => {
          btn.addEventListener('click', () => goToPromo(Number(btn.dataset.promoDot)));
        });
      };

      const goToPromo = (next) => {
        const total = getSlideCount();
        promoIdx = ((next % total) + total) % total;
        if (trackEl) trackEl.style.transform = `translateX(-${promoIdx * 100}%)`;
        renderPromoDots();
        resetAuto();
      };

      const resetAuto = () => {
        clearInterval(autoTimer);
        if (getSlideCount() > 1) {
          autoTimer = setInterval(() => goToPromo(promoIdx + 1), 4500);
        }
      };

      const renderHubBanner = () => {
        if (!trackEl) return;
        const custom = getHubCustomImages();
        promoIdx = 0;
        if (custom.length) {
          trackEl.innerHTML = custom.map(src => `<div class="w-full h-full shrink-0"><img src="${src}" alt="Banner" class="w-full h-full object-cover" /></div>`).join('');
        } else {
          trackEl.innerHTML = DEFAULT_ARTS.map(art => `<div class="w-full h-full shrink-0">${art}</div>`).join('');
        }
        trackEl.style.transform = 'translateX(0%)';
        renderPromoDots();
        resetAuto();
        syncHubBannerSize();
      };

      if (viewportEl) {
        let swipeStartX = null;
        viewportEl.addEventListener('pointerdown', (e) => {
          swipeStartX = e.clientX;
          clearInterval(autoTimer);
        });
        viewportEl.addEventListener('pointerup', (e) => {
          if (swipeStartX === null) return;
          const diff = e.clientX - swipeStartX;
          swipeStartX = null;
          if (Math.abs(diff) > 35) goToPromo(diff < 0 ? promoIdx + 1 : promoIdx - 1);
          else resetAuto();
        });
        viewportEl.addEventListener('pointercancel', () => {
          swipeStartX = null;
          resetAuto();
        });
      }

      hubBannerFile?.addEventListener('change', async () => {
        const files = Array.from(hubBannerFile.files || []);
        if (!files.length) return;
        const readAsData = (f) => new Promise((res) => {
          const r = new FileReader();
          r.onload = () => res(String(r.result || ''));
          r.readAsDataURL(f);
        });
        const newUrls = (await Promise.all(files.map(readAsData))).filter(Boolean);
        const cur = getHubCustomImages();
        saveHubCustomImages([...cur, ...newUrls]);
        hubBannerFile.value = '';
        renderHubBanner();
      });

      renderHubBanner();

      // Lightweight Vox Context Menu for Welcome Page (Banner & Music Box)
      let hubCtxEl = null;
      const closeHubCtx = () => {
        if (hubCtxEl) { hubCtxEl.classList.add('hidden'); hubCtxEl.classList.remove('flex'); }
      };
      const HUB_ICONS = {
        imgBlack: '<svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="2.5" y="3.5" width="19" height="17" rx="3" fill="#111111"/><circle cx="8" cy="9" r="2" fill="#F4D03F"/><path d="M5 17.5l4.5-4.5 3 3 3.5-4 3 5.5H5z" fill="#F8F6F0"/></svg>',
        trash: '<svg class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>',
        reset: '<svg class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>',
        music: '<svg class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>',
        play: '<svg class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l15 8-15 8V4z"/></svg>',
        pause: '<svg class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>',
        stop: '<svg class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>'
      };

      const showHubCtx = (x, y, items) => {
        if (!hubCtxEl) {
          hubCtxEl = document.createElement('div');
          hubCtxEl.className = 'fixed z-[180] hidden flex-col gap-1 w-56 vox-card bg-[#F8F6F0] p-1.5 vox-panel-enter';
          document.body.appendChild(hubCtxEl);
          document.addEventListener('click', (e) => { if (!hubCtxEl.contains(e.target)) closeHubCtx(); });
          window.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeHubCtx(); });
        }
        hubCtxEl.innerHTML = items.map((it, idx) => `
          <button type="button" data-hctx="${idx}" class="w-full text-left px-2.5 py-1.5 rounded-lg font-display font-bold text-xs ${it.danger ? 'text-[#E74C3C] hover:bg-red-50' : 'text-[#111111] hover:bg-[#F4D03F]'} transition-colors cursor-pointer flex items-center gap-2">${it.icon || ''}<span>${esc(it.label)}</span></button>
        `).join('');
        hubCtxEl.querySelectorAll('[data-hctx]').forEach(btn => {
          btn.addEventListener('click', () => {
            const act = items[Number(btn.dataset.hctx)]?.onClick;
            closeHubCtx();
            if (act) act();
          });
        });
        hubCtxEl.classList.remove('hidden');
        hubCtxEl.classList.add('flex');
        const left = Math.min(x, window.innerWidth - 235);
        const top = Math.min(y, window.innerHeight - 160);
        hubCtxEl.style.left = `${Math.max(8, left)}px`;
        hubCtxEl.style.top = `${Math.max(8, top)}px`;
      };

      document.getElementById('promo-banner')?.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        const custom = getHubCustomImages();
        const items = [
          { icon: HUB_ICONS.imgBlack, label: 'เพิ่ม / เปลี่ยนภาพแบนเนอร์', onClick: () => hubBannerFile?.click() }
        ];
        if (custom.length > 1) {
          items.push({
            icon: HUB_ICONS.trash,
            label: 'ลบภาพสไลด์นี้',
            danger: true,
            onClick: () => {
              const next = custom.filter((_, i) => i !== promoIdx);
              saveHubCustomImages(next);
              renderHubBanner();
            }
          });
        }
        if (custom.length) {
          items.push({
            icon: HUB_ICONS.reset,
            label: 'คืนค่าแบนเนอร์เริ่มต้น',
            danger: true,
            onClick: () => { saveHubCustomImages([]); renderHubBanner(); }
          });
        }
        showHubCtx(e.clientX, e.clientY, items);
      });

      document.getElementById('hub-bgm-slot')?.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        const st = window.HelpDaiBgm?.getState?.();
        const items = [
          { icon: HUB_ICONS.music, label: 'เลือก / เปลี่ยนเพลง YouTube', onClick: () => window.HelpDaiBgmModal?.() }
        ];
        if (st?.videoId) {
          items.push({ icon: st.playing ? HUB_ICONS.pause : HUB_ICONS.play, label: st.playing ? 'พักเพลง' : 'เล่นต่อ', onClick: () => window.HelpDaiBgm?.setPlaying(!st.playing) });
          items.push({ icon: HUB_ICONS.stop, label: 'ปิดเพลง', danger: true, onClick: () => window.HelpDaiBgm?.stop() });
        }
        showHubCtx(e.clientX, e.clientY, items);
      });
    })();
  </script>
  <script src="assets/js/changelog.js"></script>
</body>
</html>
