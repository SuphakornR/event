<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https:; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://storage.ko-fi.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://storage.ko-fi.com; font-src https://fonts.gstatic.com; img-src 'self' https: data:; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://ko-fi.com;" />
  <title>HelpDai — Event Toolkit</title>
  <meta name="description" content="HelpDai — ชุดเครื่องมือจัดกิจกรรมและตารางคะแนนสดแบบเรียลไทม์" />
  <meta name="theme-color" content="#F4D03F" />
  <meta property="og:title" content="HelpDai — Event Toolkit" />
  <meta property="og:description" content="ชุดเครื่องมือจัดกิจกรรมและตารางคะแนนสดแบบเรียลไทม์" />
  <meta property="og:type" content="website" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cpath d='M9 9 H35 V35 H9 Z' transform='translate(3.5 3.5)' fill='%23111111'/%3E%3Cpath d='M9 9 H35 V35 H9 Z' fill='%23F4D03F' stroke='%23111111' stroke-width='3' stroke-linejoin='round'/%3E%3Ccircle cx='18' cy='21' r='2.3' fill='%23111111'/%3E%3Ccircle cx='28' cy='21' r='2.3' fill='%23111111'/%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Prompt:wght@600;700;800;900&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/vox.css" />
</head>
<body class="flex flex-col selection:bg-yellow-300 selection:text-black">
  <script src="assets/js/loader.js"></script>

  <main class="w-full max-w-5xl mx-auto px-4 sm:px-8 py-5 sm:py-7 flex-1 flex flex-col gap-5 sm:gap-6">

    <!-- Masthead + Top-Right Swipeable PR Banner -->
    <header class="border-b-[3px] border-[#111111] pb-4 flex flex-col lg:flex-row lg:items-center justify-between gap-5">
      <div class="min-w-0">
        <div class="flex flex-wrap items-center gap-2.5 mb-3">
          <div class="inline-flex items-center gap-2 bg-[#111111] text-[#F8F6F0] px-2.5 py-0.5 rounded-md font-display font-extrabold text-[11px] sm:text-xs tracking-wider shadow-[2px_2px_0px_#F4D03F]">
            <span class="w-2 h-2 rounded-full bg-[#F4D03F]"></span>
            <span>HELPDAI • EVENT STUDIO</span>
          </div>
          <button type="button" data-start-tutorial class="inline-flex items-center gap-1 bg-white text-[#111111] border-2 border-[#111111] px-2.5 py-0.5 rounded-md font-display font-extrabold text-[11px] shadow-[2px_2px_0px_#111111] hover:bg-[#F4D03F] transition-colors cursor-pointer">? คู่มือ</button>
          <div id="helpdai-auth-slot" class="inline-flex items-center"></div>
          <div id="hub-mascots" class="flex items-end gap-2 ml-1" aria-hidden="true"></div>
        </div>
        <h1 class="thai-safe font-display font-black text-5xl sm:text-6xl text-[#111111] tracking-tight flex flex-wrap items-center gap-2 leading-none">
          <span>Help</span><span class="inline-block bg-[#F4D03F] border-[3px] border-[#111111] px-3 py-0.5 rounded-xl shadow-[5px_5px_0px_#111111] -rotate-1">Dai</span>
        </h1>
        <p class="thai-safe-tight font-semibold text-sm sm:text-base text-[#111111]/75 mt-2">ชุดเครื่องมือจัดกิจกรรมแบบเรียลไทม์ — ครบ จบ สนุกในหน้าเดียว</p>
      </div>

      <!-- Top-Right Swipeable Announcement / PR Banner -->
      <aside id="promo-banner" class="vox-card bg-white w-full lg:w-[26rem] shrink-0 p-3.5 flex flex-col gap-2.5 select-none" aria-label="จุดประชาสัมพันธ์">
        <div class="flex items-center justify-between gap-2">
          <span class="inline-flex items-center gap-1.5 bg-[#111111] text-[#F4D03F] px-2 py-0.5 rounded-md font-display font-extrabold text-[11px] tracking-wider">
            <svg class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l14-5v12L3 13v-2z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg>
            <span>ประชาสัมพันธ์</span>
          </span>
          <div class="flex items-center gap-1.5">
            <div id="promo-dots" class="flex items-center gap-1"></div>
            <button type="button" id="promo-prev" aria-label="สไลด์ก่อนหน้า" class="w-6 h-6 rounded-md border-2 border-[#111111] bg-[#F8F6F0] hover:bg-[#F4D03F] font-display font-black text-xs flex items-center justify-center cursor-pointer">‹</button>
            <button type="button" id="promo-next" aria-label="สไลด์ถัดไป" class="w-6 h-6 rounded-md border-2 border-[#111111] bg-[#F8F6F0] hover:bg-[#F4D03F] font-display font-black text-xs flex items-center justify-center cursor-pointer">›</button>
          </div>
        </div>

        <div id="promo-viewport" class="overflow-hidden rounded-xl border-2 border-[#111111] bg-[#F8F6F0] touch-pan-y">
          <div id="promo-track" class="flex transition-transform duration-500 ease-[cubic-bezier(0.22,1,0.36,1)]">
            <!-- Populated dynamically -->
          </div>
        </div>
      </aside>
    </header>

    <!-- Tool cards (rendered from the TOOLS list below: add one entry to add a tool) -->
    <section id="tool-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-5 sm:gap-6" aria-label="เครื่องมือทั้งหมด"></section>

    <footer class="mt-auto pt-4 border-t-2 border-[#111111]/15 flex flex-wrap items-center justify-between gap-2 text-xs font-semibold text-[#111111]/55">
      <span>HelpDai • Interactive Event Toolkit</span>
      <div class="flex items-center gap-2.5">
        <button type="button" id="open-sugg-btn" class="btn-vox bg-[#F4D03F] hover:bg-[#f2c61d] text-[#111111] font-display font-bold text-xs px-3 py-1 rounded-lg inline-flex items-center gap-1.5 cursor-pointer">
          <svg class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 0 1 8.91 14"/></svg>
          <span>เสนอแนะ</span>
        </button>
        <button type="button" data-open-tos class="hover:text-[#111111] underline cursor-pointer">ข้อตกลงการใช้งาน (ToS)</button>
        <div class="inline-flex items-center">
          <script type='text/javascript' src='https://storage.ko-fi.com/cdn/widget/Widget_2.js'></script>
          <script type='text/javascript'>if (window.kofiwidget2) { kofiwidget2.init('Support me on Ko-fi', '#000000', 'S6X22B3KQD'); kofiwidget2.draw(); }</script>
        </div>
      </div>
    </footer>
  </main>

  <!-- Suggestion Box Modal -->
  <div id="sugg-modal" class="hidden fixed inset-0 z-50 items-center justify-center p-4 bg-[#111111]/60 backdrop-blur-sm" aria-hidden="true">
    <div class="vox-panel-enter w-full max-w-md vox-card bg-[#F8F6F0] p-5 flex flex-col gap-3">
      <div class="flex items-center justify-between gap-2 pb-2 border-b-2 border-[#111111]">
        <div class="flex items-center gap-2">
          <span class="w-7 h-7 rounded-lg border-2 border-[#111111] bg-[#F4D03F] flex items-center justify-center shadow-[2px_2px_0px_#111111]">
            <svg class="w-4 h-4 text-[#111111]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 0 1 8.91 14"/></svg>
          </span>
          <h2 class="thai-safe-tight font-display font-extrabold text-base text-[#111111]">กล่องเสนอแนะ</h2>
        </div>
        <button type="button" id="close-sugg-btn" aria-label="ปิดกล่องเสนอแนะ" class="w-7 h-7 rounded-lg border-2 border-[#111111] bg-white hover:bg-[#E74C3C] hover:text-white font-display font-black text-xs flex items-center justify-center cursor-pointer transition-colors">✕</button>
      </div>

      <div class="flex items-center gap-1.5" id="sugg-cats">
        <button type="button" data-sugg-cat="ฟีเจอร์ใหม่" class="sugg-cat-btn px-2.5 py-1 rounded-lg border-2 border-[#111111] bg-[#111111] text-[#F4D03F] font-display font-bold text-[11px] cursor-pointer transition-colors">ฟีเจอร์ใหม่</button>
        <button type="button" data-sugg-cat="UX/UI" class="sugg-cat-btn px-2.5 py-1 rounded-lg border-2 border-[#111111] bg-white text-[#111111] hover:bg-[#F4D03F]/40 font-display font-bold text-[11px] cursor-pointer transition-colors">UX/UI</button>
        <button type="button" data-sugg-cat="แจ้งบั๊ก" class="sugg-cat-btn px-2.5 py-1 rounded-lg border-2 border-[#111111] bg-white text-[#111111] hover:bg-[#F4D03F]/40 font-display font-bold text-[11px] cursor-pointer transition-colors">แจ้งบั๊ก</button>
      </div>

      <form id="sugg-form" class="flex flex-col gap-2.5">
        <textarea id="sugg-text" rows="3" maxlength="500" required placeholder="อยากได้เครื่องมืออะไรเพิ่ม หรือพบจุดปรับปรุง พิมพ์ได้เลย..." class="thai-safe w-full bg-white border-2 border-[#111111] rounded-xl px-3 py-2 text-xs sm:text-sm font-medium resize-none focus:outline-none"></textarea>
        <button type="submit" class="btn-vox bg-[#F4D03F] hover:bg-[#f2c61d] text-[#111111] font-display font-extrabold text-xs sm:text-sm px-4 py-2 rounded-xl cursor-pointer">ส่งข้อเสนอแนะ</button>
      </form>

      <div id="sugg-status" class="hidden text-xs font-display font-bold text-[#111111] bg-[#F4D03F]/50 border-2 border-[#111111] rounded-lg px-3 py-1.5"></div>
      <div id="sugg-list" class="hidden flex-col gap-1.5 pt-2 border-t-2 border-dashed border-[#111111]/15 max-h-32 overflow-y-auto"></div>
    </div>
  </div>

  <script src="assets/js/config.js" defer></script>
  <script src="assets/js/auth.js" defer></script>
  <script src="assets/js/tos.js" defer></script>
  <script src="assets/js/mascots.js"></script>
  <script src="assets/js/tutorial.js" defer></script>
  <script>
    (() => {
      // Single source of truth for the menu. status: 'live' | 'soon'
      const TOOLS = [
        {
          id: 'scoreboard',
          status: 'live',
          shape: 0,
          title: 'Stage Scoreboard',
          desc: 'กระดานคะแนนสดบนเวที ปรับเพิ่ม-ลดทีมและกิจกรรมได้อิสระ พร้อมตัวจับเวลา เพลง YouTube และฉลองผู้ชนะในหน้าเดียว',
          actions: [
            { label: 'เปิดใช้งาน', href: 'scoreboard.html', primary: true }
          ]
        },
        {
          id: 'poll',
          status: 'live',
          shape: 1,
          title: 'Live QR Poll',
          desc: 'สร้างโพลให้คนในห้องสแกน QR โหวตสดจากมือถือ แสดงกราฟผลเรียลไทม์ (ผู้เข้าร่วมแก้ไขเนื้อหาไม่ได้)',
          actions: [
            { label: 'เปิดใช้งาน', href: 'poll.html', primary: true }
          ]
        },
        {
          id: 'ocr',
          status: 'live',
          shape: 2,
          title: 'OpenThai OCR',
          desc: 'สแกนข้อความภาษาไทย-อังกฤษจากรูปภาพหรือคลิปบอร์ด แปลงเป็นข้อความแก้ไขและคัดลอกได้ทันที',
          actions: [
            { label: 'เปิดใช้งาน', href: 'ocr.html', primary: true }
          ]
        }
      ];

      const esc = (v) => String(v).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

      function toolCard(t) {
        const live = t.status === 'live';
        const mascot = VoxMascots.svg(t.shape, live ? undefined : '#E5E1D4', 'w-16 h-16');
        const badge = live
          ? '<span class="text-[11px] font-display font-black px-2 py-0.5 rounded-md border-2 border-[#111111] bg-[#F4D03F]">พร้อมใช้งาน</span>'
          : '<span class="text-[11px] font-display font-black px-2 py-0.5 rounded-md border-2 border-[#111111] bg-white text-[#111111]/60">เร็วๆ นี้</span>';
        const actions = live
          ? `<div class="flex flex-wrap gap-2.5 mt-auto pt-2">${t.actions.map(a => `
              <a href="${esc(a.href)}" class="btn-vox ${a.primary ? 'bg-[#F4D03F] hover:bg-[#f2c61d]' : 'bg-white hover:bg-yellow-50'} text-[#111111] font-display font-extrabold text-sm px-4 py-2 rounded-xl">${esc(a.label)}</a>`).join('')}</div>`
          : '<div class="mt-auto pt-2 text-xs font-semibold text-[#111111]/50">กำลังเตรียมเครื่องมือนี้</div>';
        return `
          <article class="vox-card p-5 flex flex-col gap-3 ${live ? 'vox-card-hover' : 'opacity-60 border-dashed'}">
            <div class="flex items-start justify-between gap-3">
              ${mascot}
              ${badge}
            </div>
            <h2 class="thai-safe-tight font-display font-extrabold text-xl text-[#111111]">${esc(t.title)}</h2>
            <p class="text-sm text-[#111111]/70 leading-relaxed">${esc(t.desc)}</p>
            ${actions}
          </article>`;
      }

      document.getElementById('tool-grid').innerHTML = TOOLS.map(toolCard).join('');
      document.getElementById('hub-mascots').innerHTML = [0, 1, 2].map(i => VoxMascots.svg(i, undefined, 'w-8 h-8')).join('');

      // Suggestion Box
      (() => {
        const SUGG_KEY = 'vox_suggestions_v1';
        let activeCat = 'ฟีเจอร์ใหม่';
        let items = [];
        try {
          const parsed = JSON.parse(localStorage.getItem(SUGG_KEY) || '[]');
          if (Array.isArray(parsed)) items = parsed;
        } catch (_) {}

        const modalEl = document.getElementById('sugg-modal');
        const listEl = document.getElementById('sugg-list');
        const statusEl = document.getElementById('sugg-status');
        const textEl = document.getElementById('sugg-text');

        const openModal = () => {
          if (!modalEl) return;
          modalEl.classList.remove('hidden');
          modalEl.classList.add('flex');
          modalEl.setAttribute('aria-hidden', 'false');
          textEl?.focus();
        };
        const closeModal = () => {
          if (!modalEl) return;
          modalEl.classList.add('hidden');
          modalEl.classList.remove('flex');
          modalEl.setAttribute('aria-hidden', 'true');
        };
        document.getElementById('open-sugg-btn')?.addEventListener('click', openModal);
        document.getElementById('close-sugg-btn')?.addEventListener('click', closeModal);
        modalEl?.addEventListener('click', (e) => {
          if (e.target === modalEl) closeModal();
        });

        const renderSuggestions = () => {
          if (!listEl) return;
          if (!items.length) {
            listEl.classList.add('hidden');
            listEl.classList.remove('flex');
            listEl.innerHTML = '';
            return;
          }
          listEl.classList.remove('hidden');
          listEl.classList.add('flex');
          listEl.innerHTML = items.slice(0, 4).map((it, idx) => `
            <div class="flex items-center justify-between gap-2 bg-[#F8F6F0] border border-[#111111]/25 rounded-lg px-2.5 py-1.5 text-xs">
              <div class="flex items-center gap-2 min-w-0">
                <span class="shrink-0 bg-[#111111] text-[#F4D03F] px-1.5 py-0.5 rounded font-display font-bold text-[10px]">${esc(it.cat)}</span>
                <span class="truncate text-[#111111]/85 font-medium">${esc(it.text)}</span>
              </div>
              <button type="button" data-sugg-del="${idx}" aria-label="ลบข้อเสนอแนะ" class="shrink-0 text-[11px] font-bold text-[#111111]/45 hover:text-[#E74C3C] cursor-pointer">✕</button>
            </div>
          `).join('');
          listEl.querySelectorAll('[data-sugg-del]').forEach(btn => {
            btn.addEventListener('click', () => {
              items.splice(Number(btn.dataset.suggDel), 1);
              try { localStorage.setItem(SUGG_KEY, JSON.stringify(items)); } catch (_) {}
              renderSuggestions();
            });
          });
        };

        document.querySelectorAll('.sugg-cat-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            activeCat = btn.dataset.suggCat;
            document.querySelectorAll('.sugg-cat-btn').forEach(b => {
              const on = b.dataset.suggCat === activeCat;
              b.classList.toggle('bg-[#111111]', on);
              b.classList.toggle('text-[#F4D03F]', on);
              b.classList.toggle('bg-white', !on);
              b.classList.toggle('text-[#111111]', !on);
            });
          });
        });

        document.getElementById('sugg-form')?.addEventListener('submit', async (e) => {
          e.preventDefault();
          const val = (textEl?.value || '').trim();
          if (!val) return;
          items.unshift({ cat: activeCat, text: val, at: Date.now() });
          items = items.slice(0, 12);
          try { localStorage.setItem(SUGG_KEY, JSON.stringify(items)); } catch (_) {}
          const cfg = window.HELPDAI_CONFIG || {};
          const defaultApiBase = (!location.hostname.endsWith('github.io') && location.protocol.startsWith('http')) ? location.origin : '';
          const apiBase = (cfg.apiBase || defaultApiBase).replace(/\/$/, '');
          const ep = cfg.suggestionEndpoint || (apiBase ? `${apiBase}/api/suggestions` : '');
          if (ep) {
            try {
              await fetch(ep, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
                body: JSON.stringify({ category: activeCat, message: val })
              });
            } catch (_) {}
          }
          if (textEl) textEl.value = '';
          if (statusEl) {
            statusEl.textContent = '✓ บันทึกข้อเสนอแนะเรียบร้อยแล้ว ขอบคุณครับ!';
            statusEl.classList.remove('hidden');
            setTimeout(() => statusEl.classList.add('hidden'), 3200);
          }
          renderSuggestions();
        });

        renderSuggestions();
      })();

      // Swipeable PR / Announcement Banner
      const PROMOS = [
        { tag: 'NEW', accent: '#F4D03F', title: 'จัดการทุกอย่างบนเวทีได้ทันที', desc: 'คลิกที่ทีมเพื่อปรับคะแนน หรือคลิกขวากิจกรรมเพื่อใส่กติกา รูปภาพ และวิดีโอ YouTube' },
        { tag: 'LIVE', accent: '#2980B9', title: 'ครบจบในหน้าเดียวสำหรับพิธีกร', desc: 'รองรับ 2–8 ทีม, 1–6 กิจกรรม พร้อมสุ่มทีม ตัวจับเวลา เพลง YouTube และฉลองผู้ชนะ' },
        { tag: 'PRO', accent: '#E74C3C', title: 'เริ่มไวด้วยเทมเพลต & สำรองไฟล์', desc: 'คลิกขวาพื้นหลังเพื่อเลือกเทมเพลต 1 คลิก หรือบันทึก/โหลดไฟล์งาน (.json) ได้ตลอดเวลา' }
      ];

      const trackEl = document.getElementById('promo-track');
      const dotsEl = document.getElementById('promo-dots');
      const viewportEl = document.getElementById('promo-viewport');
      let promoIdx = 0;
      let autoTimer = null;

      if (trackEl && dotsEl && viewportEl) {
        trackEl.innerHTML = PROMOS.map(p => `
          <div class="w-full shrink-0 p-3 flex items-start gap-2.5">
            <span class="text-[10px] font-display font-black px-2 py-0.5 rounded border-2 border-[#111111] shrink-0 mt-0.5" style="background:${p.accent}; color:${p.accent === '#F4D03F' ? '#111111' : '#FFFFFF'}">${esc(p.tag)}</span>
            <div class="min-w-0">
              <div class="thai-safe-tight font-display font-extrabold text-sm text-[#111111] truncate">${esc(p.title)}</div>
              <p class="text-xs text-[#111111]/70 leading-snug mt-0.5">${esc(p.desc)}</p>
            </div>
          </div>
        `).join('');

        const renderPromoState = () => {
          trackEl.style.transform = `translateX(-${promoIdx * 100}%)`;
          dotsEl.innerHTML = PROMOS.map((_, i) => `
            <button type="button" data-promo-dot="${i}" aria-label="สไลด์ ${i + 1}" class="h-2 rounded-full border border-[#111111] transition-all cursor-pointer ${i === promoIdx ? 'w-5 bg-[#F4D03F]' : 'w-2 bg-white'}"></button>
          `).join('');
          dotsEl.querySelectorAll('[data-promo-dot]').forEach(btn => {
            btn.addEventListener('click', () => goToPromo(Number(btn.dataset.promoDot)));
          });
        };

        const goToPromo = (next) => {
          promoIdx = ((next % PROMOS.length) + PROMOS.length) % PROMOS.length;
          renderPromoState();
          resetAuto();
        };

        const resetAuto = () => {
          clearInterval(autoTimer);
          autoTimer = setInterval(() => goToPromo(promoIdx + 1), 4500);
        };

        document.getElementById('promo-prev')?.addEventListener('click', () => goToPromo(promoIdx - 1));
        document.getElementById('promo-next')?.addEventListener('click', () => goToPromo(promoIdx + 1));

        // Pointer / Touch Swipe Navigation
        let swipeStartX = null;
        viewportEl.addEventListener('pointerdown', (e) => {
          swipeStartX = e.clientX;
          clearInterval(autoTimer);
        });
        viewportEl.addEventListener('pointerup', (e) => {
          if (swipeStartX === null) return;
          const diff = e.clientX - swipeStartX;
          swipeStartX = null;
          if (Math.abs(diff) > 35) {
            goToPromo(diff < 0 ? promoIdx + 1 : promoIdx - 1);
          } else {
            resetAuto();
          }
        });
        viewportEl.addEventListener('pointercancel', () => {
          swipeStartX = null;
          resetAuto();
        });

        renderPromoState();
        resetAuto();
      }
    })();
  </script>
</body>
</html>
