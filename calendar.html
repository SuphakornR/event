<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https:; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' https: data:;" />
  <title>Calendar — suphakorn.rukkarn</title>
  <meta name="description" content="ปฏิทินจัดตารางกิจกรรม นัดหมาย และสิ่งที่ต้องทำแบบเรียบง่าย" />
  <meta name="theme-color" content="#F4D03F" />
  <link rel="icon" type="image/svg+xml" href="assets/img/logo.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Prompt:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/vox.css?v=20261123d" />
  <style>
    .cal-day-cell {
      transition: transform 0.14s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.15s ease, box-shadow 0.14s ease;
    }
    .cal-day-cell:hover {
      transform: translateY(-1px);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-yellow-300 selection:text-black">
  <script src="assets/js/loader.js?v=20261126b"></script>

  <main class="w-full max-w-7xl mx-auto px-3.5 sm:px-6 py-4 flex-1 flex flex-col gap-4">

    <!-- Editorial Header -->
    <header class="border-b-[3px] border-[#111111] pb-3 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-2.5 min-w-0">
        <a href="index.html" title="กลับหน้าหลัก" aria-label="กลับหน้าหลัก" class="btn-vox bg-white hover:bg-[#F4D03F] text-[#111111] w-9 h-9 rounded-lg font-display font-black text-sm flex items-center justify-center shrink-0">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </a>
        <img src="assets/img/logo.svg" alt="suphakorn.rukkarn" class="w-8 h-8 shrink-0 hidden sm:block" />
        <div class="min-w-0">
          <h1 class="thai-safe-tight font-display font-black text-xl sm:text-2xl text-[#111111] truncate">ปฏิทิน (Calendar)</h1>
          <p id="cal-header-sub" class="text-xs font-semibold text-[#111111]/60">จัดการนัดหมายและตารางกิจกรรม</p>
        </div>
      </div>

      <!-- Month Navigation & Backup -->
      <div class="flex flex-wrap items-center gap-2 shrink-0">
        <div class="inline-flex items-center bg-[#F8F6F0] border-2 border-[#111111] rounded-xl p-0.5 shadow-[2px_2px_0px_#111111]">
          <button type="button" id="cal-prev-btn" aria-label="เดือนก่อนหน้า" class="px-2.5 py-1 rounded-lg hover:bg-white font-display font-black text-xs cursor-pointer transition-colors">‹</button>
          <button type="button" id="cal-today-btn" class="px-3 py-1 rounded-lg bg-[#111111] text-[#F4D03F] font-display font-bold text-xs cursor-pointer">วันนี้</button>
          <button type="button" id="cal-next-btn" aria-label="เดือนถัดไป" class="px-2.5 py-1 rounded-lg hover:bg-white font-display font-black text-xs cursor-pointer transition-colors">›</button>
        </div>
        <button type="button" id="cal-export-ics-btn" title="ส่งออกไฟล์ปฏิทิน (.ics)" class="btn-vox bg-white hover:bg-[#F4D03F] text-[#111111] font-display font-bold text-xs px-3 py-1.5 rounded-xl cursor-pointer">ส่งออก .ics</button>
        <button type="button" id="cal-export-btn" class="btn-vox bg-white hover:bg-[#F4D03F] text-[#111111] font-display font-bold text-xs px-3 py-1.5 rounded-xl cursor-pointer">สำรอง</button>
        <label class="btn-vox bg-white hover:bg-[#F4D03F] text-[#111111] font-display font-bold text-xs px-3 py-1.5 rounded-xl cursor-pointer">
          <span>เปิดไฟล์</span>
          <input type="file" id="cal-import-input" accept=".json,application/json" class="hidden" />
        </label>
      </div>
    </header>

    <!-- Main 2-Column Calendar + Day Agenda -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 flex-1 items-start">

      <!-- LEFT (8 cols): Month Grid -->
      <section class="lg:col-span-8 vox-card bg-white p-4 flex flex-col gap-3" aria-label="ตารางปฏิทินรายเดือน">
        <div class="flex items-center justify-between gap-2 pb-2 border-b-2 border-[#111111]/10">
          <h2 id="cal-month-title" class="thai-safe font-display font-black text-lg sm:text-xl text-[#111111]"></h2>
          <span id="cal-month-count" class="text-xs font-display font-bold text-[#111111]/60">0 กิจกรรมในเดือนนี้</span>
        </div>

        <!-- Weekday Headers -->
        <div class="grid grid-cols-7 gap-1.5 text-center font-display font-extrabold text-[11px] text-[#111111]/60">
          <div class="text-[#E74C3C]">อา.</div>
          <div>จ.</div>
          <div>อ.</div>
          <div>พ.</div>
          <div>พฤ.</div>
          <div>ศ.</div>
          <div class="text-[#2980B9]">ส.</div>
        </div>

        <!-- 42-Cell Calendar Grid -->
        <div id="cal-grid" class="grid grid-cols-7 gap-1.5"></div>
      </section>

      <!-- RIGHT (4 cols): Selected Day Agenda + Upcoming -->
      <aside class="lg:col-span-4 flex flex-col gap-4">
        <section class="vox-card bg-white p-4 flex flex-col gap-3" aria-label="รายละเอียดวันที่เลือก">
          <div class="flex items-center justify-between gap-2 border-b-2 border-[#111111]/10 pb-2">
            <div>
              <span class="text-[10px] font-display font-black uppercase tracking-wider text-[#111111]/55">วันที่เลือก</span>
              <h2 id="cal-selected-title" class="thai-safe font-display font-black text-base text-[#111111]"></h2>
            </div>
            <span id="cal-day-badge" class="px-2 py-0.5 rounded-lg bg-[#F4D03F] border-2 border-[#111111] font-display font-black text-[11px]">0 งาน</span>
          </div>

          <!-- Add Event Form -->
          <form id="cal-add-form" class="bg-[#F8F6F0] border-2 border-[#111111] rounded-2xl p-3 flex flex-col gap-2">
            <input id="cal-in-title" type="text" required maxlength="100" placeholder="เพิ่มกิจกรรม นัดหมาย หรือสิ่งที่ต้องทำ..." class="thai-safe bg-white border-2 border-[#111111] rounded-xl px-3 py-2 text-xs sm:text-sm font-semibold focus:outline-none" />
            <div class="grid grid-cols-2 gap-2">
              <input id="cal-in-time" type="time" aria-label="เวลา" class="bg-white border-2 border-[#111111]/50 rounded-xl px-2.5 py-1.5 text-xs font-mono font-bold focus:outline-none" />
              <div class="flex items-center justify-end gap-1.5 bg-white border-2 border-[#111111]/50 rounded-xl px-2 py-1" role="radiogroup" aria-label="สีป้ายกำกับ">
                <button type="button" data-cal-color="#F4D03F" title="กิจกรรม" class="cal-color-btn w-5 h-5 rounded-full bg-[#F4D03F] border-2 border-[#111111] ring-2 ring-[#111111] ring-offset-1 cursor-pointer"></button>
                <button type="button" data-cal-color="#2980B9" title="งาน/เรียน" class="cal-color-btn w-5 h-5 rounded-full bg-[#2980B9] border-2 border-[#111111] cursor-pointer"></button>
                <button type="button" data-cal-color="#E74C3C" title="สำคัญ" class="cal-color-btn w-5 h-5 rounded-full bg-[#E74C3C] border-2 border-[#111111] cursor-pointer"></button>
                <button type="button" data-cal-color="#10B981" title="ส่วนตัว" class="cal-color-btn w-5 h-5 rounded-full bg-[#10B981] border-2 border-[#111111] cursor-pointer"></button>
              </div>
            </div>
            <input id="cal-in-note" type="text" maxlength="140" placeholder="สถานที่ / หมายเหตุ (ถ้ามี)" class="thai-safe bg-white border border-[#111111]/40 rounded-xl px-3 py-1.5 text-xs font-medium focus:outline-none" />
            <button type="submit" class="btn-vox bg-[#F4D03F] hover:bg-[#f2c61d] text-[#111111] font-display font-black text-xs py-2 rounded-xl cursor-pointer">+ เพิ่มลงปฏิทิน</button>
          </form>

          <!-- Events for Selected Date -->
          <div id="cal-day-events" class="flex flex-col gap-2 max-h-[260px] overflow-y-auto pr-0.5 vox-scroll-area"></div>
        </section>

        <!-- Upcoming Events -->
        <section class="vox-card bg-white p-4 flex flex-col gap-2.5" aria-label="กิจกรรมที่กำลังจะมาถึง">
          <h3 class="font-display font-black text-xs uppercase tracking-wider text-[#111111]/65 border-b border-[#111111]/15 pb-1.5">กำลังจะมาถึง (Upcoming)</h3>
          <div id="cal-upcoming-list" class="flex flex-col gap-1.5 max-h-[180px] overflow-y-auto pr-0.5 vox-scroll-area"></div>
        </section>
      </aside>
    </div>
  </main>

  <script src="assets/js/security.js"></script>
  <script src="assets/js/calendar.js"></script>
  <script src="assets/js/bgm-dock.js?v=20261126b" defer></script>
</body>
</html>
