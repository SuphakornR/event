<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https:; connect-src 'self' https:; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' https: data:;" />
  <title>HelpDai — Live QR Poll</title>
  <meta name="description" content="HelpDai Live QR Poll — สแกน QR โหวตสดในห้องแบบปลอดภัย ผู้เข้าร่วมแก้ไขเนื้อหาไม่ได้" />
  <meta name="theme-color" content="#F4D03F" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cpath d='M9 9 H35 V35 H9 Z' transform='translate(3.5 3.5)' fill='%23111111'/%3E%3Cpath d='M9 9 H35 V35 H9 Z' fill='%23F4D03F' stroke='%23111111' stroke-width='3' stroke-linejoin='round'/%3E%3Ccircle cx='18' cy='21' r='2.3' fill='%23111111'/%3E%3Ccircle cx='28' cy='21' r='2.3' fill='%23111111'/%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Prompt:wght@600;700;800;900&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/vox.css" />
</head>
<body class="min-h-screen flex flex-col selection:bg-yellow-300 selection:text-black">
  <script src="assets/js/loader.js"></script>

  <main class="w-full max-w-6xl mx-auto px-4 sm:px-6 py-4 flex-1 flex flex-col gap-4">
    <!-- Header -->
    <header class="border-b-[3px] border-[#111111] pb-2.5 flex flex-wrap items-center justify-between gap-2">
      <div class="flex items-center gap-2.5 min-w-0">
        <a id="poll-back-link" href="index.html" class="btn-vox bg-white hover:bg-[#F4D03F] text-[#111111] font-display font-bold text-xs px-2.5 py-1 rounded-lg shrink-0">← เมนูหลัก</a>
        <div class="inline-flex items-center gap-1.5 bg-[#111111] text-[#F4D03F] px-2.5 py-0.5 rounded-md font-display font-extrabold text-[11px] tracking-wider shrink-0">
          <span class="w-2 h-2 rounded-full bg-[#10B981]"></span>
          <span>LIVE QR POLL</span>
        </div>
        <h1 class="thai-safe-tight font-display font-black text-xl sm:text-2xl text-[#111111] truncate">โหวตสดในห้องผ่าน QR</h1>
      </div>
      <span id="poll-total-badge" class="bg-[#F4D03F] border-2 border-[#111111] px-3 py-1 rounded-xl font-display font-black text-xs shadow-[2px_2px_0px_#111111]">0 โหวต</span>
    </header>

    <!-- HOST / PROJECTOR VIEW -->
    <section id="poll-host-view" class="hidden flex-1 grid-cols-1 lg:grid-cols-12 gap-4 items-stretch">
      <!-- Left: Admin Controls + QR Code -->
      <aside class="lg:col-span-5 flex flex-col gap-3">
        <div class="vox-card bg-white p-4 flex flex-col gap-3">
          <div class="flex items-center justify-between border-b-2 border-[#111111]/15 pb-2">
            <span class="font-display font-extrabold text-xs uppercase tracking-wider text-[#111111]">ตั้งค่าคำถาม (เฉพาะ Host)</span>
            <button type="button" id="poll-toggle-open" class="btn-vox bg-[#10B981] text-white font-display font-extrabold text-[11px] px-2.5 py-1 rounded-lg cursor-pointer">กำลังเปิดโหวต</button>
          </div>
          <input id="poll-in-q" type="text" maxlength="160" placeholder="พิมพ์คำถาม..." class="thai-safe-tight w-full bg-[#F8F6F0] border-2 border-[#111111] rounded-xl px-3 py-2 text-sm font-bold" />
          <div id="poll-in-opts" class="flex flex-col gap-1.5"></div>
          <div class="flex flex-wrap items-center justify-between gap-2 pt-1">
            <div class="flex items-center gap-1.5">
              <button type="button" id="poll-add-opt" class="btn-vox bg-white hover:bg-[#F4D03F] font-display font-bold text-xs px-2.5 py-1 rounded-lg cursor-pointer">+ ตัวเลือก</button>
              <button type="button" id="poll-reset-votes" class="btn-vox bg-white hover:bg-red-50 text-[#E74C3C] font-display font-bold text-xs px-2.5 py-1 rounded-lg cursor-pointer">ล้างผลโหวต</button>
            </div>
            <button type="button" id="poll-save-btn" class="btn-vox bg-[#F4D03F] hover:bg-[#f2c61d] text-[#111111] font-display font-extrabold text-xs px-3.5 py-1.5 rounded-xl cursor-pointer">อัปเดตโพล</button>
          </div>
        </div>

        <!-- QR Join Card -->
        <div class="vox-card bg-white p-4 flex items-center gap-4">
          <img id="poll-qr-img" src="" alt="QR Code สำหรับสแกนโหวต" class="w-28 h-28 sm:w-32 sm:h-32 rounded-xl border-2 border-[#111111] bg-[#F8F6F0] shrink-0" />
          <div class="min-w-0 flex-1 flex flex-col gap-2">
            <span class="font-display font-black text-sm text-[#111111]">สแกนเพื่อโหวต (โหมดผู้เข้าร่วม)</span>
            <p class="text-[11px] text-[#111111]/65 leading-relaxed">ผู้เข้าร่วมจะเห็นเฉพาะหน้าโหวต ไม่สามารถแก้ไขคำถามหรือลบผลโหวตได้</p>
            <button type="button" id="poll-copy-link" class="btn-vox bg-[#F8F6F0] hover:bg-[#F4D03F] text-[#111111] font-display font-bold text-xs px-3 py-1.5 rounded-lg w-fit cursor-pointer">คัดลอกลิงก์โหวต</button>
          </div>
        </div>
      </aside>

      <!-- Right: Live Projector Bar Chart -->
      <section class="lg:col-span-7 flex flex-col">
        <div class="vox-card bg-white p-5 sm:p-6 flex-1 flex flex-col gap-4">
          <h2 id="poll-host-question" class="thai-safe font-display font-black text-2xl sm:text-3xl text-[#111111]"></h2>
          <div id="poll-host-bars" class="flex-1 flex flex-col justify-center gap-3"></div>
        </div>
      </section>
    </section>

    <!-- VOTER MOBILE VIEW (READ-ONLY QUESTION + TAP TO VOTE) -->
    <section id="poll-voter-view" class="hidden flex-1 items-center justify-center">
      <div class="vox-card bg-white w-full max-w-md p-5 sm:p-6 flex flex-col gap-4">
        <div class="flex items-center justify-between">
          <span id="poll-voter-status" class="inline-block bg-[#F4D03F] border-2 border-[#111111] px-2.5 py-0.5 rounded-md font-display font-black text-[11px]">เลือกคำตอบของคุณ (1 สิทธิ์)</span>
        </div>
        <h2 id="poll-voter-question" class="thai-safe font-display font-black text-xl sm:text-2xl text-[#111111]"></h2>
        <div id="poll-voter-choices" class="flex flex-col gap-2.5"></div>
      </div>
    </section>
  </main>

  <script src="assets/js/config.js" defer></script>
  <script src="assets/js/tos.js" defer></script>
  <script src="assets/js/poll.js" defer></script>
</body>
</html>
