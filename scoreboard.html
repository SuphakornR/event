  <!-- ========================================================================
       PERSISTENT VISUAL HOST ELEMENT (MOVED SEAMLESSLY BETWEEN ACCORDION & ZOOM)
       Keeps YouTube iframe alive without reload; Vox controls stay hidden until hover
       ======================================================================== -->
  <div id="media-visual-host" class="hidden relative isolate w-full">
    <!-- Animated Visual Pane (YouTube 16:9 or Image/GIF) -->
    <div id="media-visual-pane" class="media-visual-pane relative z-[1] w-full"></div>

        <button

            id="center-timer-toggle-btn"
            title="เริ่ม / หยุดเวลา"
            aria-label="เริ่มหรือหยุดเวลา"
            class="btn-vox bg-[#F4D03F] hover:bg-[#f2c61d] text-[#111111] w-8 h-8 rounded-xl flex items-center justify-center cursor-pointer"
          >
            <svg id="center-timer-toggle-icon" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l15 8-15 8V4z"/></svg>
          </button>
          <button
            type="button"
            id="center-timer-reset-btn"
            title="รีเซ็ตเวลา"
            aria-label="รีเซ็ตเวลา"
            class="btn-vox bg-white hover:bg-red-50 text-[#111111] w-8 h-8 rounded-xl flex items-center justify-center cursor-pointer"
          >
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
          </button>
          <button
            type="button"
            id="center-timer-minimize-btn"
            class="btn-vox bg-[#F8F6F0] hover:bg-[#F4D03F] text-[#111111] font-display font-bold text-xs px-3 py-1.5 rounded-xl inline-flex items-center gap-1.5 cursor-pointer"
          >
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14h6v6M20 10h-6V4M14 10l7-7M10 14l-7 7"/></svg>
            <span>ย่อไปมุมจอ</span>
          </button>
        </div>
      </div>

      <!-- Circular Liquid-Rise Vox Countdown (Dual Layered Waves: Darker Back Flow + Pure Front Wave) -->
      <div class="timer-circle-mask relative w-64 h-64 sm:w-80 sm:h-80 rounded-full border-[5px] border-[#111111] bg-[#F8F6F0] shadow-[8px_8px_0px_#111111] overflow-hidden flex items-center justify-center">
        <!-- Back Darker Wave Layer (Opposite Flow Speed & Phase, Zero Seam) -->
        <div id="center-timer-bar-back" class="timer-liquid-fill" style="height: 0%; background-color: #1B5E8A;">
          <svg class="timer-liquid-wave-back" viewBox="0 0 240 64" preserveAspectRatio="none" aria-hidden="true">
            <path id="center-timer-wave-back-path" d="M0 24 Q 30 46 60 24 T 120 24 T 180 24 T 240 24 L 240 64 L 0 64 Z" fill="#1B5E8A"/>
          </svg>
        </div>
        <!-- Front Brighter Wave Layer (Pure Solid Color, Zero Seam) -->
        <div id="center-timer-bar" class="timer-liquid-fill" style="height: 0%; background-color: #2980B9;">
          <svg class="timer-liquid-wave" viewBox="0 0 240 64" preserveAspectRatio="none" aria-hidden="true">
            <path id="center-timer-wave-path" d="M0 24 Q 30 2 60 24 T 120 24 T 180 24 T 240 24 L 240 64 L 0 64 Z" fill="#2980B9"/>
          </svg>
        </div>

        <div id="center-timer-digits" class="relative z-10 bg-white/95 border-[3px] border-[#111111] rounded-2xl px-5 py-2 shadow-[4px_4px_0px_#111111] font-display font-black text-5xl sm:text-6xl text-[#111111] tabular-nums leading-none tracking-tight select-none">
          03:00

      <!-- Quick Presets & Nudge Bar inside Center Timer -->
      <div class="flex flex-wrap items-center justify-center gap-1.5 w-full">
        <button type="button" data-ct-preset="30" class="btn-vox bg-white hover:bg-[#F4D03F] text-[#111111] font-display font-bold text-xs px-2.5 py-1 rounded-lg cursor-pointer">30s</button>
        <button type="button" data-ct-preset="60" class="btn-vox bg-white hover:bg-[#F4D03F] text-[#111111] font-display font-bold text-xs px-2.5 py-1 rounded-lg cursor-pointer">1m</button>
        <button type="button" data-ct-preset="180" class="btn-vox bg-white hover:bg-[#F4D03F] text-[#111111] font-display font-bold text-xs px-2.5 py-1 rounded-lg cursor-pointer">3m</button>
        <button type="button" data-ct-preset="300" class="btn-vox bg-white hover:bg-[#F4D03F] text-[#111111] font-display font-bold text-xs px-2.5 py-1 rounded-lg cursor-pointer">5m</button>
        <span class="w-px h-4 bg-[#111111]/20 mx-0.5"></span>
        <button type="button" data-ct-nudge="-10" class="btn-vox bg-white hover:bg-red-50 text-[#E74C3C] font-display font-bold text-xs px-2.5 py-1 rounded-lg cursor-pointer">−10s</button>
        <button type="button" data-ct-nudge="10" class="btn-vox bg-white hover:bg-[#F4D03F] text-[#111111] font-display font-bold text-xs px-2.5 py-1 rounded-lg cursor-pointer">+10s</button>
        <button type="button" data-ct-nudge="60" class="btn-vox bg-white hover:bg-[#F4D03F] text-[#111111] font-display font-bold text-xs px-2.5 py-1 rounded-lg cursor-pointer">+1m</button>
      </div>

      <div id="center-timer-timesup-badge" class="hidden bg-[#111111] text-[#F4D03F] border-[3px] border-[#111111] px-5 py-2 rounded-xl font-display font-black text-xl sm:text-2xl tracking-wider shadow-[4px_4px_0px_#F4D03F]">
        TIME'S UP! หมดเวลา!
      </div>

       ======================================================================== -->

  <script src="assets/js/config.js?v=20261122b" defer></script>
  <script src="assets/js/security.js?v=20261122b" defer></script>
  <script src="assets/js/mascots.js?v=20261122b" defer></script>
  <script src="assets/js/scoreboard.js?v=20261123b" defer></script>
  <script src="assets/js/auth.js?v=20261122b" defer></script>
  <script src="assets/js/cloud-sync.js?v=20261123a" defer></script>
  <script src="assets/js/tos.js?v=20261122b" defer></script>
  <script src="assets/js/tutorial.js?v=20261122b" defer></script>
  <script src="assets/js/context-menu.js?v=20261122e" defer></script>
  <script src="assets/js/bgm-dock.js?v=20261126a" defer></script>
  <script src="assets/js/toolbox.js?v=20261123a" defer></script>
  <script>
    (() => {
      const BANNER_KEY = 'helpdai_stage_custom_banner_v1';
      const trackEl = document.getElementById('stage-banner-track');
      const dotsEl = document.getElementById('stage-banner-dots');
      const bannerEl = document.getElementById('stage-top-banner');
      const uploadBtn = document.getElementById('stage-banner-upload-btn');
      const resetBtn = document.getElementById('stage-banner-reset-btn');
      const fileInp = document.getElementById('stage-banner-file');
      if (!trackEl || !dotsEl || !bannerEl) return;

      const BANNERS_KEY = 'helpdai_stage_custom_banners_v1';
      let idx = 0;
      let timerId = null;

      const getCustomImgs = () => {
        try {
          const arr = JSON.parse(localStorage.getItem(BANNERS_KEY) || 'null');
          if (Array.isArray(arr) && arr.length) return arr.filter(Boolean);
          const legacy = localStorage.getItem(BANNER_KEY);
          if (legacy) {
            localStorage.setItem(BANNERS_KEY, JSON.stringify([legacy]));
            localStorage.removeItem(BANNER_KEY);
            return [legacy];
          }
        } catch (_) {}
        return [];
      };
      const saveCustomImgs = (arr) => {
        try {
          if (arr.length) localStorage.setItem(BANNERS_KEY, JSON.stringify(arr));
          else localStorage.removeItem(BANNERS_KEY);
        } catch (_) {}
      };
      const getCount = () => getCustomImgs().length;

      const renderSlides = () => {
        const customImgs = getCustomImgs();
        idx = 0;
        if (customImgs.length) {
          trackEl.innerHTML = customImgs.map(src => `<div class="w-full h-full shrink-0 relative"><img src="${src}" alt="Event Banner" class="w-full h-full object-cover" /></div>`).join('');
        } else {
          trackEl.innerHTML = '';
        }
        syncState();
        resetAuto();
      };

      const syncState = () => {
        const total = getCount();
        trackEl.style.transform = `translateX(-${idx * 100}%)`;
        dotsEl.classList.toggle('hidden', total <= 1);
        dotsEl.innerHTML = Array.from({ length: total }, (_, i) => `
          <button type="button" data-sb-dot="${i}" aria-label="แบนเนอร์ ${i + 1}" class="h-1.5 rounded-full transition-all cursor-pointer ${i === idx ? 'w-4 bg-[#F4D03F]' : 'w-1.5 bg-white/60'}"></button>
        `).join('');
        dotsEl.querySelectorAll('[data-sb-dot]').forEach(b => {
          b.addEventListener('click', () => go(Number(b.dataset.sbDot)));
        });
      };

      const go = (next) => {
        const total = getCount();
        idx = ((next % total) + total) % total;
        syncState();
        resetAuto();
      };

      const resetAuto = () => {
        clearInterval(timerId);
        if (getCount() > 1) {
          timerId = setInterval(() => go(idx + 1), 5000);
        }
      };

      document.getElementById('stage-top-banner')?.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        e.stopPropagation();
        let m = document.getElementById('stage-banner-ctx');
        if (!m) {
          m = document.createElement('div');
          m.id = 'stage-banner-ctx';
          m.className = 'fixed z-[180] hidden flex-col gap-1 w-56 vox-card bg-[#F8F6F0] p-1.5 vox-panel-enter';
          document.body.appendChild(m);
          document.addEventListener('click', (ev) => { if (!m.contains(ev.target)) m.classList.add('hidden'); });
          window.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') m.classList.add('hidden'); });
        }
        const customImgs = getCustomImgs();
        m.innerHTML = `
          <button type="button" data-sbc="upload" class="w-full text-left px-2.5 py-1.5 rounded-lg font-display font-bold text-xs text-[#111111] hover:bg-[#F4D03F] cursor-pointer flex items-center gap-2">
            <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="2.5" y="3.5" width="19" height="17" rx="3" fill="#111111"/><circle cx="8" cy="9" r="2" fill="#F4D03F"/><path d="M5 17.5l4.5-4.5 3 3 3.5-4 3 5.5H5z" fill="#F8F6F0"/></svg>
            <span>เพิ่ม / เปลี่ยนภาพแบนเนอร์</span>
          </button>
          ${customImgs.length > 1 ? `<button type="button" data-sbc="delone" class="w-full text-left px-2.5 py-1.5 rounded-lg font-display font-bold text-xs text-[#E74C3C] hover:bg-red-50 cursor-pointer flex items-center gap-2"><svg class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg><span>ลบภาพสไลด์นี้</span></button>` : ''}
          ${customImgs.length ? `<button type="button" data-sbc="reset" class="w-full text-left px-2.5 py-1.5 rounded-lg font-display font-bold text-xs text-[#E74C3C] hover:bg-red-50 cursor-pointer flex items-center gap-2"><svg class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg><span>คืนค่าแบนเนอร์เริ่มต้น</span></button>` : ''}
        `;
        m.querySelector('[data-sbc="upload"]')?.addEventListener('click', () => { m.classList.add('hidden'); fileInp?.click(); });
        m.querySelector('[data-sbc="delone"]')?.addEventListener('click', () => {
          m.classList.add('hidden');
          saveCustomImgs(customImgs.filter((_, i) => i !== idx));
          renderSlides();
        });
        m.querySelector('[data-sbc="reset"]')?.addEventListener('click', () => {
          m.classList.add('hidden');
          saveCustomImgs([]);
          renderSlides();
        });
        m.classList.remove('hidden');
        m.classList.add('flex');
        m.style.left = `${Math.max(8, Math.min(e.clientX, window.innerWidth - 235))}px`;
        m.style.top = `${Math.max(8, Math.min(e.clientY, window.innerHeight - 150))}px`;
      });

      fileInp?.addEventListener('change', async () => {
        const files = Array.from(fileInp.files || []);
        if (!files.length) return;
        const readAsData = (f) => new Promise((res) => {
          const r = new FileReader();
          r.onload = () => res(String(r.result || ''));
          r.readAsDataURL(f);
        });
        const newUrls = (await Promise.all(files.map(readAsData))).filter(Boolean);
        saveCustomImgs([...getCustomImgs(), ...newUrls]);
        fileInp.value = '';
        renderSlides();
      });

      const stageSizeBadge = document.getElementById('stage-banner-size-badge');
      const syncStageBannerSize = () => {
        if (!bannerEl || !stageSizeBadge) return;
        const r = bannerEl.getBoundingClientRect();
        if (r.width > 0 && r.height > 0) {
          stageSizeBadge.textContent = `${Math.round(r.width)} × ${Math.round(r.height)} px`;
        }
      };
      bannerEl?.addEventListener('pointerenter', syncStageBannerSize);
      window.addEventListener('resize', syncStageBannerSize);
      syncStageBannerSize();

      renderSlides();
    })();
  </script>
